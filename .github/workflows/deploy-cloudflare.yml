name: Validate Cloudflare build
# Cloudflare Workers Builds publishes main; this workflow only validates the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-build-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build verified production artifact
        run: npm run build
